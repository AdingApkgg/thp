<script src="/__workspace/quiet-audio.js"></script><script type="module">

let mode='color';

const check=(v,m)=>{if(!v)throw Error(m);},status=document.querySelector('#status'),result=document.querySelector('#result');
document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;mode=document.querySelector('#mode').value;document.querySelector('#mode').disabled=true;const observer=installStageShaderObserver(document.querySelector('#canvas'));try{
 const [prepared,build,wasm,native,nativePixels,cases]=await Promise.all([fetch('/checks/stage-angle-shaders/prepared.json').then(r=>r.json()),fetch('/checks/stage-angle-shaders/'+mode+'/build.json').then(r=>r.json()),fetch('/checks/stage-angle-shaders/'+mode+'/gpu.wasm').then(r=>r.arrayBuffer()),fetch('/checks/stage-angle-shaders/native-color.json').then(r=>r.json()),mode==='color'?fetch('/checks/stage-angle-shaders/native-color.bgra').then(r=>r.arrayBuffer()):null,mode==='uv'?fetch('/checks/stage-angle-shaders/uv-cases.json').then(r=>r.json()):null]);

 const create=(await import('/checks/stage-angle-shaders/'+mode+'/gpu.mjs')).default,module=await create({canvas:document.querySelector('#canvas'),locateFile:n=>'/checks/stage-angle-shaders/'+mode+'/'+n});check(module._gpu_initialize(),'Initialize');
 const gl=document.querySelector('#canvas').getContext('webgl2'),debug=gl.getExtension('WEBGL_debug_renderer_info'),clip=gl.getExtension('EXT_clip_control');
 const gpu={vendor:debug?gl.getParameter(debug.UNMASKED_VENDOR_WEBGL):gl.getParameter(gl.VENDOR),renderer:debug?gl.getParameter(debug.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER),version:gl.getParameter(gl.VERSION),shadingLanguageVersion:gl.getParameter(gl.SHADING_LANGUAGE_VERSION),subpixelBits:gl.getParameter(gl.SUBPIXEL_BITS),clipControlAvailable:!!clip,clipOrigin:clip?gl.getParameter(clip.CLIP_ORIGIN_EXT):null,clipDepthMode:clip?gl.getParameter(clip.CLIP_DEPTH_MODE_EXT):null,clipLowerLeft:clip?clip.LOWER_LEFT_EXT:null,clipZeroToOne:clip?clip.ZERO_TO_ONE_EXT:null,colorBufferFloatAvailable:!!gl.getExtension('EXT_color_buffer_float')};
 const words=(v,fn)=>{const a=new Uint32Array(v),p=module._gpu_allocate(a.byteLength);check(p||!a.byteLength,'Allocate');module.HEAPU8.set(new Uint8Array(a.buffer),p);try{return fn(p);}finally{module._gpu_release(p);}};

 const rows=mode==='color'?native.frames:cases.cases,reports=[];let differentChannels=0,maxDelta=0,exact=0,differentSampleWords=0;
 for(let i=0;i<rows.length;i++){
  observer.mark({mode,frameIndex:i});const row=rows[i],frame=prepared.frames.find(f=>f.stage===row.stage&&f.frame===row.frame);check(frame,'Recorded frame');check(module._gpu_begin(),'Begin');if(mode==='uv')check(module._gpu_float_begin(),'Float target');for(const c of frame.initialState)execute(c);
  let drawIndex=0;for(const c of frame.commands){if(mode==='uv'&&c.kind==='draw'){if(drawIndex++!==row.originalDrawIndex)continue;for(const [k,v]of[[7,0],[14,0],[15,0],[27,0],[28,0]])check(module._gpu_render_state(k,v),'Isolated override');}execute(c);}
  let actual;if(mode==='color'){const p=module._gpu_read();check(p,'Color read');actual=module.HEAPU8.slice(p,p+row.bytes);}else{const p=module._gpu_allocate(640*480*16);check(module._gpu_float_read(p),'Float read');actual=module.HEAPU8.slice(p,p+640*480*16);module._gpu_release(p);}
  const actualSha=await sha(actual),nativeSha=mode==='color'?row.sha256:row.nativeSha256,report={index:i,stage:row.stage,frame:row.frame,role:row.role||'stageColor21',originalDrawIndex:row.originalDrawIndex??null,portableSha256:actualSha,nativeSha256:nativeSha,strictFullBufferHashEqual:actualSha===nativeSha,bytes:actual.length};if(actualSha===nativeSha)exact++;
  if(mode==='color'){
   const expected=new Uint8Array(nativePixels,row.offset,row.bytes),first=[];let differences=0,delta=0;for(let j=0;j<actual.length;j++)if(actual[j]!==expected[j]){differences++;delta=Math.max(delta,Math.abs(actual[j]-expected[j]));if(first.length<32)first.push({x:(j>>2)%640,y:Math.floor(j/(640*4)),channel:j%4,portable:actual[j],native:expected[j]});}Object.assign(report,{differentChannels:differences,maxDelta:delta,first});differentChannels+=differences;maxDelta=Math.max(maxDelta,delta);
  }else{
   const view=new DataView(actual.buffer,actual.byteOffset,actual.byteLength),samples=[];let covered=0;for(let p=12;p<actual.length;p+=16)if(view.getFloat32(p,true)!==0)covered++;report.portableCovered=covered;
   for(const s of row.samples){const at=(s.y*640+s.x)*16,values=[],ws=[];let different=0;for(let k=0;k<4;k++){ws.push(view.getUint32(at+k*4,true));values.push(view.getFloat32(at+k*4,true));different+=ws[k]!==s.words[k];}differentSampleWords+=different;samples.push({...s,portableWords:ws,portableValues:values,differentWords:different});}report.samples=samples;report.nativeFullBytesAvailable=row.nativeFullBytesAvailable;
   if(row.nativeFullBytesAvailable){const expected=new Uint8Array(await fetch('/checks/stage-angle-shaders/native-full/'+String(i).padStart(3,'0')).then(r=>r.arrayBuffer()));check(await sha(expected)===nativeSha,'Native full UV binding');const nv=new DataView(expected.buffer);let nc=0,coverage=0,uv=0,delta=0;const first=[];for(let j=0;j<actual.length;j+=16){const ca=view.getFloat32(j+12,true)!==0,na=nv.getFloat32(j+12,true)!==0;nc+=na;coverage+=ca!==na;for(let k=0;k<4;k++)if(view.getUint32(j+k*4,true)!==nv.getUint32(j+k*4,true)){const av=view.getFloat32(j+k*4,true),n=nv.getFloat32(j+k*4,true);if(k<2&&ca&&na){uv++;delta=Math.max(delta,Math.abs(av-n));}if(first.length<32)first.push({x:(j/16)%640,y:Math.floor(j/(640*16)),channel:k,native:n,portable:av});}}Object.assign(report,{nativeCovered:nc,coverageDifferences:coverage,differentUVOnCommonCoverage:uv,maxUVDelta:delta,first});}
  }
  report.savedFile=null;report.fullPixelsArchived=false;reports.push(report);status.textContent='Compared '+reports.length+'/'+rows.length+' · '+exact+' exact full buffers';await new Promise(requestAnimationFrame);
 }
 const statsNames=['calls','batches','uploadBytes','readBytes','frames','presentations','bufferReplacements','bufferSubUpdates','vertexUploadBytes','directBytes','copiedBytes','layoutSetups','textureBinds','framebufferBinds','programCompiles','genericBatches','resamples'];const sp=module._sdl_stats();check(sp,'Existing production statistics');const statsView=new DataView(module.HEAPU8.buffer,sp,statsNames.length*4);const rendererStatistics=Object.fromEntries(statsNames.map((n,i)=>[n,statsView.getUint32(i*4,true)]));
 const report={rendererStatistics,diagnosticOnly:true,completeGame:false,nativeEquivalent:false,mode,label:build.label,backendVersion:10,sourceBindings:build.sourceBindings,wasmSha256:build.wasmSha256,vertexSourceChanged:build.vertexSourceChanged,fragmentUVOverride:build.fragmentUVOverride,gpu,frames:reports.length,exactFullBuffers:exact,strictPixelsEqual:exact===reports.length,differentChannels,maxDelta,differentSampleWords,reports,scope:mode==='color'?native.scope:'All 21 selected original mismatch draws plus 2 original coverage controls. Current vertex source unchanged. UV fragment output; alpha/depth/blend/fog disabled, other draws skipped. Frozen Native full hashes cover every draw, complete Native pixels available for 7 controls. Portable buffers are read for comparison; this shader diagnostic does not archive them.'};
 report.shaderBackend=await observer.snapshot();report.fullPixelsArchived=false;report.shaderObserverSha256='275e955a1066c94072d1544fb33a251c1cb3cf073ec0bab6cce671b94c8f8dac';report.scope+=' Actual linked shader sources/translated sources and backend API queries are diagnostic observations only; full pixels are read for existing controls but not newly archived.';const saved=await fetch('/checks/stage-angle-shaders/capture/'+mode+'/report.json',{method:'POST',body:JSON.stringify(report,null,2)+'\n'}).then(r=>{check(r.ok,'Save report');return r.json();});result.textContent=JSON.stringify(report,null,2);status.textContent='Completed · '+exact+'/'+rows.length+' exact full buffers';
 }catch(e){status.textContent='Failed';result.textContent=JSON.stringify({error:e.message,stack:e.stack},null,2);}};
