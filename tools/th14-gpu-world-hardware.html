<!doctype html><html lang="zh"><meta charset="utf-8"><title>TH14 世界坐标与雾对照</title>
<style>body{background:#191c26;color:#eee;font:16px system-ui;margin:28px}button,input{font:inherit;padding:10px}canvas{image-rendering:pixelated}#canvas{width:160px;height:120px}#preview{width:512px;height:256px;display:block;margin:18px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-width:1100px}</style>
<h1>TH14 世界坐标与雾对照</h1><p>实际 Direct3D9（原作首选硬件顶点处理）／生产 WebGL，正交／透视投影、3 种世界矩阵、2 种视图矩阵、纹理坐标变换、4 种顶点雾模式、距离／深度雾、点／线性采样。</p>
<button id="run">运行 384 场景</button><p id="status">等待运行</p><canvas id="preview" width="64" height="32"></canvas>
<label>查看场景 <input id="case" type="number" min="0" max="383" value="0"></label><button id="inspect">查看原版／移植像素</button><p id="caseStatus"></p>
<canvas id="canvas" width="640" height="480"></canvas><pre id="result"></pre>
<script type="module">
import create from './gpu.mjs';
const status=document.querySelector('#status'),button=document.querySelector('#run'),result=document.querySelector('#result'),ctx=document.querySelector('#preview').getContext('2d');
const hex=async b=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',b)),n=>n.toString(16).padStart(2,'0')).join('');
let core,native,expected,actual;
function inspect(i){if(!native||i<0||i>=native.cases.length)return;const c=native.cases[i];for(const [x,data] of [[0,expected],[32,actual]]){const image=new ImageData(32,32);for(let j=0;j<4096;j+=4){const p=i*4096+j;image.data[j]=data[p+2];image.data[j+1]=data[p+1];image.data[j+2]=data[p];image.data[j+3]=255;}ctx.putImageData(image,x,0);}document.querySelector('#caseStatus').textContent=`场景 ${i}，世界矩阵 ${c.world}，视图 ${c.view}，透视 ${c.projection}，纹理变换 ${c.textureTransform}，雾 ${c.fog}，距离雾 ${c.range}，点采样 ${c.point}；左 D3D9，右 WebGL`;}
document.querySelector('#inspect').addEventListener('click',()=>inspect(Number(document.querySelector('#case').value)));
button.addEventListener('click',async()=>{button.disabled=true;try{
 status.textContent='正在绘制并读取 GPU 像素';
 const data=await Promise.all([fetch('./native.json').then(r=>r.json()),fetch('./native.bgra').then(r=>r.arrayBuffer()).then(b=>new Uint8Array(b)),fetch('./build.json').then(r=>r.json())]);[native,expected]=data;const build=data[2];
 core??=await create({canvas:document.querySelector('#canvas')});if(!core._gpu_initialize())throw Error('生产渲染器初始化失败');
 actual=new Uint8Array(expected.length);const groups=[],differences=[];let exactCases=0,maxDelta=0,totalChannels=0;
 for(let i=0;i<native.cases.length;i++){
  const c=native.cases[i],p=core._gpu_world_case(c.world,c.view,c.projection,c.textureTransform,c.fog,c.range,c.point);if(!p)throw Error('绘制场景失败'+i);
  const pixels=new Uint8Array(core.HEAPU8.buffer,p,4096);actual.set(pixels,i*4096);let channels=0,max=0,first=null;
  for(let j=0;j<4096;j++){const a=pixels[j],b=expected[i*4096+j],delta=Math.abs(a-b);if(delta){++channels;max=Math.max(max,delta);first??={x:Math.floor(j/4)%32,y:Math.floor(j/128),channel:j%4,portable:a,d3d9:b};}}
  const group=c.projection*4+c.fog;groups[group]??={projection:c.projection,fog:c.fog,cases:0,exactCases:0,differentChannels:0,maxDelta:0};const g=groups[group];g.cases++;g.differentChannels+=channels;g.maxDelta=Math.max(g.maxDelta,max);if(!channels){exactCases++;g.exactCases++;}else if(differences.length<32)differences.push({index:i,...c,differentChannels:channels,maxDelta:max,first});
  totalChannels+=channels;maxDelta=Math.max(maxDelta,max);
 }
 const report={completeGame:false,nativeEquivalent:false,strictPixelsEqual:exactCases===native.cases.length,cases:native.cases.length,exactCases,maxDelta,differentChannels:totalChannels,nativePixelsSha256:await hex(expected),portablePixelsSha256:await hex(actual),wasmSha256:build.wasmSha256,groups,firstDifferences:differences};
 status.textContent=`已完成 ${report.cases} 场景；逐通道完全一致 ${exactCases}；最大差值 ${maxDelta}`;result.textContent=JSON.stringify(report,null,2);inspect(differences[0]?.index??70);
 }catch(e){status.textContent='测试失败：'+e.message;result.textContent=String(e.stack||e);}finally{button.disabled=false;}});
</script></html>
