<!doctype html><meta charset="utf-8"><title>TH14 deferred capture pixel evidence</title>
<style>body{font:16px system-ui;background:#18212a;color:#dbe7ef;padding:24px}pre{white-space:pre-wrap}button{padding:12px}canvas{width:320px;height:240px}</style>
<h1>TH14 deferred copy · isolated full pixels</h1><p>Declared synthetic backbuffer; actual text52 destination and rectangle controls. Full independent original32 D3DX buffers; failures retained.</p>
<button id="run">Run full comparison</button><p id="status">Ready</p><canvas id="canvas" width="640" height="480"></canvas><pre id="result"></pre>
<script type="module">
const sha=async b=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',b)),v=>v.toString(16).padStart(2,'0')).join('');const check=(v,m)=>{if(!v)throw Error(m);};
const status=document.querySelector('#status'),result=document.querySelector('#result');document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;try{
 const [native,build,source,wasm]=await Promise.all([fetch('/native.json').then(r=>r.json()),fetch('/webgl-build.json').then(r=>r.json()),fetch('/source.bgra').then(r=>r.arrayBuffer()),fetch('/capture.wasm').then(r=>r.arrayBuffer())]);check(await sha(wasm)===build.wasmSha256,'Module');check(await sha(source)===native.bindings.find(b=>b.path.endsWith('source.bgra')).sha256,'Source');
 const module=await(await import('/capture.mjs')).default({canvas:document.querySelector('#canvas'),locateFile:n=>'/'+n});check(module._capture_initialize(),'Initialize');module.HEAPU8.set(new Uint8Array(source),module._capture_source());
 const gl=document.querySelector('#canvas').getContext('webgl2'),debug=gl.getExtension('WEBGL_debug_renderer_info'),gpu={renderer:debug?gl.getParameter(debug.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER),version:gl.getParameter(gl.VERSION),shadingLanguageVersion:gl.getParameter(gl.SHADING_LANGUAGE_VERSION)};const reports=[];
 for(const row of native.cases){check(module._capture_case(row.destinationFormat,...row.sourceRect,...row.destinationRect),'Execute');const bytes=module.HEAPU8.slice(module._capture_pixels(),module._capture_pixels()+row.bytes),words=Array.from(new Int32Array(module.HEAPU8.buffer,module._capture_words(),10)),actualSha=await sha(bytes),expected=new Uint8Array(await fetch('/'+row.pixelFile).then(r=>r.arrayBuffer()));check(await sha(expected)===row.pixelSha256,'Original32 pixels');let count=0,max=0,pixels=0;const first=[];for(let j=0;j<bytes.length;j+=row.bpp){let different=false;for(let k=0;k<row.bpp;k++)if(bytes[j+k]!==expected[j+k]){++count;different=true;max=Math.max(max,Math.abs(bytes[j+k]-expected[j+k]));if(first.length<20)first.push({x:j/row.bpp%512,y:Math.floor(j/row.bpp/512),byte:k,portable:bytes[j+k],native:expected[j+k]});}pixels+=different;}
 const saved=await fetch('/capture/portable-'+String(row.index).padStart(3,'0')+'.pixels',{method:'POST',body:bytes}).then(r=>r.json());check(saved.sha256===actualSha,'Saved');reports.push({...row,portableSha256:actualSha,strictFullBufferEqual:actualSha===row.pixelSha256,differentBytes:count,differentPixels:pixels,maxByteDelta:max,first,words});status.textContent='Compared '+reports.length+'/'+native.cases.length;await new Promise(requestAnimationFrame);}
 const controls=[];for(let mode=0;mode<3;mode++){check(module._capture_control(mode),'Control');const words=Array.from(new Int32Array(module.HEAPU8.buffer,module._capture_words(),10));controls.push({mode,label:['unmapped_resource_null','texture_handle_null','controlled_false_backend_return'][mode],words});}
 const report={diagnosticOnly:true,completeGame:false,nativeEquivalent:false,gpu,wasmSha256:build.wasmSha256,captureConsumerSha256:build.captureConsumerSha256,sourceBindings:build.bindings,frames:reports.length,exactFullBuffers:reports.filter(r=>r.strictFullBufferEqual).length,differentBytes:reports.reduce((a,r)=>a+r.differentBytes,0),reports,controls,wordOrder:['retiredFirstFile','changedCalls','flushCalls','invalidateCalls','backendCalls','backendBooleanReturn','glErrorAfterCopyAndRead','sourceHandle','targetHandle','resamplesDelta'],scope:build.scope};
 const saved=await fetch('/capture/report.json',{method:'POST',body:JSON.stringify(report,null,2)+'\n'}).then(r=>r.json());check(saved.saved,'Report');result.textContent=JSON.stringify(report,null,2);status.textContent='Completed · '+report.exactFullBuffers+'/'+reports.length+' exact full buffers';
}catch(e){status.textContent='Failed';result.textContent=String(e.stack||e);}};
</script>
