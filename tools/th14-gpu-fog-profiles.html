<!doctype html><html lang="zh"><meta charset="utf-8"><title>TH14 硬件雾系数浮点对照</title>
<style>body{background:#191c26;color:#eee;font:16px system-ui;margin:28px}button{font:inherit;padding:10px}canvas{width:160px;height:120px}pre{white-space:pre-wrap;max-width:1100px}</style>
<h1>TH14 硬件雾系数浮点对照</h1><p>5 组参数，硬件顶点处理；原生浮点目标读取和 WebGL 雾系数位编码，仅诊断。</p>
<nav><a href="/">倾斜深度</a> / <a href="/?flat=1">恒定深度</a> / <a href="/?variant=float-euler-base">近似底数</a> / <a href="/?variant=float-euler-uniform">运行时近似底数</a></nav>
<button id="run">读取 1920 场景的雾系数</button><p id="status">等待运行</p><canvas id="canvas" width="640" height="480"></canvas><pre id="result"></pre>
<script type="module">
const hex=async b=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',b)),n=>n.toString(16).padStart(2,'0')).join('');
const query=new URLSearchParams(location.search),flat=query.get('flat')==='1',variant=query.get('variant')||(flat?'float-flat':'float-fog');if(!['float-fog','float-flat','float-euler-base','float-euler-uniform'].includes(variant))throw Error('未知模块');const prefix=flat?'./flat/':'./',modulePrefix='./'+variant+'/';
document.querySelector('#run').addEventListener('click',async()=>{const button=document.querySelector('#run'),status=document.querySelector('#status'),result=document.querySelector('#result');button.disabled=true;try{
 const [native,bytes,build]=await Promise.all([fetch(prefix+'native.json').then(r=>r.json()),fetch(prefix+'native.rgba32f').then(r=>r.arrayBuffer()),fetch(modulePrefix+'build.json').then(r=>r.json())]);const expected=new DataView(bytes),groups=[],critical=[];
 const create=(await import(modulePrefix+'gpu.mjs')).default,core=await create({canvas:document.querySelector('#canvas')});if(!core._gpu_initialize())throw Error('Renderer 初始化失败');
 const points=[[91,7,19],[794,13,19],[842,11,10],[843,9,24],[856,12,10],[920,14,22],[966,14,24],[1261,14,13],[1262,17,19],[1371,25,6],[1434,18,9],[1449,11,4]];
 const encoded=new Uint8Array(native.cases.length*4096);
 for(let i=0;i<native.cases.length;i++){
  const c=native.cases[i],p=core._gpu_world_profile_case(c.profile,c.world,c.view,c.projection,c.textureTransform,c.fog,c.range,c.point);if(!p)throw Error('浮点位读取失败');const pixel=new Uint8Array(core.HEAPU8.buffer,p,4096),decoded=encoded.subarray(i*4096,(i+1)*4096),v=new DataView(decoded.buffer,decoded.byteOffset,4096);
  for(let j=0;j<4096;j+=4){decoded[j]=pixel[j+2];decoded[j+1]=pixel[j+1];decoded[j+2]=pixel[j];decoded[j+3]=pixel[j+3];}
  const group=c.projection*4+c.fog;groups[group]??={projection:c.projection,fog:c.fog,compared:0,differentFloats:0,maxDelta:0,first:[]};const g=groups[group];
  for(let j=0;j<1024;j++){if(expected.getFloat32(i*16384+j*16+12,true)===1)continue;const a=v.getFloat32(j*4,true),b=expected.getFloat32(i*16384+j*16,true);if(!Number.isFinite(a))throw Error('浮点解码失败');g.compared++;const delta=Math.abs(a-b);if(a!==b){g.differentFloats++;g.maxDelta=Math.max(g.maxDelta,delta);if(g.first.length<4)g.first.push({index:i,x:j%32,y:Math.floor(j/32),native:b,portable:a,delta});}}
  for(const [index,x,y] of points)if(i===index){const j=y*32+x;critical.push({index,x,y,...c,native:expected.getFloat32(i*16384+j*16,true),portable:v.getFloat32(j*4,true)});}
 }
 const report={variant,flatDepth:flat,diagnosticOnly:true,completeGame:false,nativeEquivalent:false,cases:native.cases.length,vertexProcessing:native.vertexProcessing,behaviorFlags:native.behaviorFlags,nativePixelsSha256:await hex(bytes),encodedPortableSha256:await hex(encoded),wasmSha256:build.wasmSha256,nativeOutputFormat:native.outputFormat,groups,critical};result.textContent=JSON.stringify(report,null,2);status.textContent='已读取硬件模式 1920 场景雾系数';
 }catch(e){status.textContent='诊断失败：'+e.message;result.textContent=String(e.stack||e);}finally{button.disabled=false;}});
</script></html>
