<!doctype html><html lang="zh"><meta charset="utf-8"><title>TH14 Extra 多人真实对话联合对照</title>
<style>body{background:#191c26;color:#eee;font:16px system-ui;margin:28px}button{font:inherit;padding:12px}canvas{image-rendering:pixelated}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-width:1100px}</style>
<h1>TH14 Extra 多人真实对话联合对照</h1><p>完整对话更新驱动真实面板和文字动画，实际 FontDevice 逐次写入字图。Extra st07e.msg 三个入口，含咲夜、雷鼓与九十九姐妹立绘及标题动画、全部前置帧，逐帧核对状态和几何；每次完整图集写入与 18 幅选定画面对照原作 GDI／D3DX／HAL。此项不含完整游戏世界、自然通关或其他驱动。</p>
<button id="run">运行真实对话联合路线</button><p id="status">等待运行</p><canvas id="canvas" width="640" height="480"></canvas><pre id="result"></pre>
<script type="module">
import create from './gpu.mjs';
const status=document.querySelector('#status'),button=document.querySelector('#run'),result=document.querySelector('#result');
const hex=async b=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',b)),n=>n.toString(16).padStart(2,'0')).join('');
button.addEventListener('click',async()=>{button.disabled=true;try{
status.textContent='加载原版联合场景与字体';const [native,expected,build,manifest]=await Promise.all([fetch('./native.json').then(r=>r.json()),fetch('./native.bgra').then(r=>r.arrayBuffer()).then(b=>new Uint8Array(b)),fetch('./build.json').then(r=>r.json()),fetch('/fonts/manifest.json').then(r=>r.json())]);
const core=await create({canvas:document.querySelector('#canvas')});core.FS.mkdir('/fonts');for(const name of ['font0.bin','font1.bin','font2.bin','font3.bin','cp932.bin','blend4444.bin','font4.bin','font5.bin','font6.bin','font7.bin']){const b=new Uint8Array(await fetch('/fonts/'+name).then(r=>r.arrayBuffer())),e=manifest.files.find(r=>r.file===name);if(!e||e.bytes!==b.length||e.sha256!==await hex(b))throw Error('字体哈希 '+name);core.FS.writeFile('/fonts/'+name,b);}if(!core._gpu_initialize())throw Error('字体或 GPU 初始化失败');
for(const [index,name] of ['text.anm', 'front.anm', 'pl02.anm', 'st07enm.anm', 'st07logo.anm', 'st07enm2.anm', 'st07enm3.anm'].entries()){const b=new Uint8Array(await fetch('/resources/'+name).then(r=>r.arrayBuffer()));if(await hex(b)!==native.resourceHashes[name])throw Error('资源哈希 '+name);const p=core._malloc(b.length);core.HEAPU8.set(b,p);if(!core._load_real_scene_resource(index,p,b.length,native.textures.filter(t=>['text.anm', 'front.anm', 'pl02.anm', 'st07enm.anm', 'st07logo.anm', 'st07enm2.anm', 'st07enm3.anm'].indexOf(t.resource)<index).length))throw Error('资源解析 '+name);core._free(p);}
const equal=(a,b,where)=>{if(JSON.stringify(a)!==JSON.stringify(b))throw Error(where+' 不符 '+JSON.stringify({actual:a,native:b}));};const words=(p,n)=>Array.from(new Uint32Array(core.HEAPU8.buffer,p,n));
const message=new Uint8Array(await fetch('/message.msg').then(r=>r.arrayBuffer()));if(await hex(message)!==native.messageSha256)throw Error('MSG 哈希');const actual=new Uint8Array(expected.length),rows=[],copies=[];let frames=0,floatComponents=0,nonExactFloatValues=0,quads=0;
for(const [row,r] of native.rows.entries()){const [stage,selection,entry,rate]=r.input,flags=0,program=message,p=core._malloc(program.length);core.HEAPU8.set(program,p);if(!core._gpu_message_begin(rate,stage,selection>>>1,entry,p,program.length))throw Error('构造失败 '+row);core._free(p);equal(words(core._sprite_data(),4*38),r.initial.flat(),'初始文字 '+row);
for(const [frame,f] of r.frames.entries()){const tag=row+'/'+frame;const code=core._message_scene_step(...f.input);if(code!==f.status)throw Error('对话状态 '+tag+': '+code);if(!f.status)equal(words(core._message_scene_state(),21),f.dialogue,'存活对话时钟 '+tag);equal(words(core._message_scene_effects(),core._message_scene_effect_words()),f.effects,'世界事件 '+tag);equal(words(core._lifecycle_alive_data(),core._count()),f.alive,'生存 '+tag);equal(words(core._sprite_data(),core._count()*38),f.state.flat(),'动画 '+tag);const chains=words(core._lifecycle_layer_data(),36*513);equal(Array.from({length:36},(_,layer)=>chains.slice(layer*513+1,layer*513+1+chains[layer*513])),f.layers,'层链 '+tag);
const wanted=f.writes.flatMap(w=>{const b=w.text?Uint8Array.from(w.text.match(/../g),h=>parseInt(h,16)):new Uint8Array();return [w.line,w.color,w.font>>>0,w.offset>>>0,w.spacing>>>0,w.plain,b.length,...b];});equal(words(core._message_scene_writes(),core._message_scene_write_words()),wanted,'文字参数 '+tag);if(core._gpu_message_snapshot_count()!==f.writes.length)throw Error('图集快照数量 '+tag);for(const [write,w] of f.writes.entries()){const hash=await hex(new Uint8Array(core.HEAPU8.buffer,core._gpu_message_snapshot(write),2097152).slice());copies.push({row,frame,write,sha256:hash,nativeSha256:w.textureSha256,exact:hash===w.textureSha256});}
const n=core._geometry_count();if(n!==f.draws.length)throw Error('几何数量 '+tag);const bits=new Uint32Array(core.HEAPU8.buffer,core._geometry_data(),n*28),values=new Float32Array(core.HEAPU8.buffer,core._geometry_data(),n*28),materials=words(core._geometry_materials(),n*9);for(const [q,d] of f.draws.entries()){equal(materials.slice(q*9,q*9+9),d.material,'材质 '+tag);for(const [v,fields] of d.vertices.entries())for(const [field,want] of fields.entries()){const at=q*28+v*7+field;if(field===4){if(bits[at]!==want)throw Error('顶点颜色 '+tag);}else{const value=values[at],diff=Math.abs(value-want);if(!Number.isFinite(value)||diff>Math.max(1e-5,Math.abs(want)*2.4e-7))throw Error('顶点 '+tag);++floatComponents;if(value!==want)++nonExactFloatValues;}}}quads+=n;++frames;
const c=native.cases.find(c=>c.row===row&&c.frame===frame);if(c){const p=core._gpu_message_frame(...c.crop);if(!p)throw Error('GPU 读回 '+tag);const pixels=new Uint8Array(core.HEAPU8.buffer,p,c.size);actual.set(pixels,c.offset);let channels=0,max=0,first=null,foreground=0;for(let j=0;j<c.size;j++){const a=pixels[j],b=expected[c.offset+j],d=Math.abs(a-b);if(d){++channels;max=Math.max(max,d);first??={x:Math.floor(j/4)%640,y:Math.floor(j/2560),channel:j%4,portable:a,d3d9:b};}}for(let j=0;j<c.size;j+=4)if(expected[c.offset+j]!==139||expected[c.offset+j+1]!==103||expected[c.offset+j+2]!==66||expected[c.offset+j+3]!==255)++foreground;rows.push({index:c.index,row,frame,input:r.input,drawCount:n,foregroundPixels:foreground,differentChannels:channels,maxDelta:max,first,pixelsSha256:await hex(pixels.slice())});}
}status.textContent=`已完成 ${row+1}/${native.rows.length} 条路线，图集 ${copies.filter(c=>c.exact).length}/${copies.length} 相同`;await new Promise(resolve=>requestAnimationFrame(resolve));}
const gl=document.querySelector('#canvas').getContext('webgl2'),info=gl.getExtension('WEBGL_debug_renderer_info');const report={completeGame:false,nativeEquivalent:false,cases:rows.length,animatedFrames:frames,quads,floatComponents,nonExactFloatValues,textureWrites:copies.length,exactTextures:copies.filter(c=>c.exact).length,exactCases:rows.filter(r=>!r.differentChannels).length,renderedCases:rows.filter(r=>r.foregroundPixels>0).length,comparedChannels:expected.length,differentChannels:rows.reduce((n,r)=>n+r.differentChannels,0),maxDelta:Math.max(...rows.map(r=>r.maxDelta)),nativePixelsSha256:await hex(expected),portablePixelsSha256:await hex(actual),wasmSha256:build.wasmSha256,debugRenderer:info?gl.getParameter(info.UNMASKED_RENDERER_WEBGL):null,copies,rows};status.textContent=`已完成 ${frames} 帧；图集 ${report.exactTextures}/${copies.length} 相同；画面 ${report.exactCases}/${rows.length} 相同；有前景 ${report.renderedCases}；最大差 ${report.maxDelta}`;result.textContent=JSON.stringify(report,null,2);
}catch(e){status.textContent='测试失败：'+e.message;result.textContent=String(e.stack||e);}finally{button.disabled=false;}});
</script></html>
