<!doctype html><html lang="zh"><meta charset="utf-8"><title>TH14 全部真实对话绘制检查</title>
<style>body{background:#1a1d25;color:#eee;font:16px system-ui;margin:24px}button{padding:12px;font:inherit}canvas{image-rendering:pixelated}#canvas{width:640px;height:480px}#preview{display:block;width:640px;height:480px}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style>
<h1>TH14 全部真实对话绘制检查</h1><p>读取本机原版资源，运行七关、六种机体的90个MSG入口；实际Dialogue、ANM、FontDevice和生产Renderer。每帧更新及绘制，文字交付后读回GPU。确认、声音、音乐与过关交付受控，不是原作完整游戏帧等价验收。</p>
<button id="run">检查全部90个入口</button><p id="status">等待检查</p><canvas id="preview" width="640" height="480"></canvas><canvas id="canvas" width="640" height="480"></canvas><pre id="result"></pre>
<script type="module">
import create from './display.mjs';
const button=document.querySelector('#run'),status=document.querySelector('#status'),result=document.querySelector('#result'),ctx=document.querySelector('#preview').getContext('2d'),hex=async b=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',b)),n=>n.toString(16).padStart(2,'0')).join('');let core;
button.addEventListener('click',async()=>{button.disabled=true;const rows=[];try{
 const build=await fetch('./build.json').then(r=>r.json()),data=new Uint8Array(await fetch('./th14.dat').then(r=>r.arrayBuffer()));if(data.length!==build.archiveBytes||await hex(data)!==build.archiveSha256)throw Error('原版资源哈希不一致');core??=await create({canvas:document.querySelector('#canvas')});core.FS.mkdir('/fonts');for(const row of build.fontManifest.files){const bytes=new Uint8Array(await fetch('./fonts/'+row.file).then(r=>r.arrayBuffer()));if(bytes.length!==row.bytes||await hex(bytes)!==row.sha256)throw Error('字体哈希不一致 '+row.file);core.FS.writeFile('/fonts/'+row.file,bytes);}
 const p=core._malloc(data.length);core.HEAPU8.set(data,p);const error=()=>{const b=core.HEAPU8,p=core._display_error();return new TextDecoder().decode(b.subarray(p,b.indexOf(0,p)));};if(!core._display_open(p,data.length))throw Error(error());core._free(p);
 for(let stage=1;stage<=7;stage++){status.textContent=`正在加载第${stage}关`;await new Promise(r=>requestAnimationFrame(r));if(!core._display_stage(stage))throw Error(error());for(let selection=0;selection<6;selection++)for(let id=0;id<core._display_entries(selection);id++){
  status.textContent=`第${stage}关 / 机体${selection} / 对话${id}；已检查${rows.length}个入口`;await new Promise(r=>requestAnimationFrame(r));const frames=core._display_run(selection,id),pixels=new Uint8Array(core.HEAPU8.buffer,core._display_pixels(),640*480*4).slice(),row={stage,selection,id,frames,requests:core._display_value(0),panels:core._display_value(1),layerDrawCalls:core._display_value(2),queuedRequests:core._display_value(3),totalWrites:core._display_value(4),gpuReadbacks:core._display_value(5),pixelsSha256:await hex(pixels)};row.foregroundPixels=0;for(let i=0;i<pixels.length;i+=4)if(pixels[i+3]&&(pixels[i]!==139||pixels[i+1]!==103||pixels[i+2]!==66||pixels[i+3]!==255))row.foregroundPixels++;if(frames<0)row.error=error();rows.push(row);const image=new ImageData(640,480);for(let i=0;i<pixels.length;i+=4){image.data[i]=pixels[i+2];image.data[i+1]=pixels[i+1];image.data[i+2]=pixels[i];image.data[i+3]=pixels[i+3];}ctx.putImageData(image,0,0);if(frames<0)throw Error(JSON.stringify(row));
 }}const report={passed:true,completeGame:false,nativeEquivalent:false,entries:rows.length,confirmationInterval:60,frames:rows.reduce((a,r)=>a+r.frames,0),requests:rows.reduce((a,r)=>a+r.requests,0),writes:core._display_value(4),wasmSha256:build.wasmSha256,archiveSha256:build.archiveSha256,rows};if(report.requests!==report.writes)throw Error('文字请求与实际上传数量不同');status.textContent=`通过${rows.length}个入口，${report.frames}帧，${report.requests}次文字交付；完整原版画面等价尚未验收`;result.textContent=JSON.stringify(report,null,2);
 }catch(e){status.textContent='检查失败：'+e.message;result.textContent=JSON.stringify({passed:false,error:String(e.stack||e),rows},null,2);}finally{button.disabled=false;}});
</script></html>
