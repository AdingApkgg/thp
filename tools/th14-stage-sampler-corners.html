const mode=new URL(location.href).searchParams.get('variant')||'matrix';if(!['matrix','mov-control'].includes(mode))throw Error('Unknown mode');const variant='sampler-corners',prefix='/variants/'+variant,create=(await import(prefix+'/gpu.mjs')).default,status=document.querySelector('#status'),result=document.querySelector('#result'),sha=async b=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',b)),v=>v.toString(16).padStart(2,'0')).join('');

 const reports=[];let differentWords=0;for(const n of native.results){const frame=prepared.frames.find(f=>f.stage===n.stage&&f.frame===n.frame),selectedDraw=n.draw;check(frame,'Frame');check(module._gpu_begin(),'Begin');for(const c of frame.initialState)check(execute(c),'Initial state');let index=0;

 const p=module._gpu_allocate(640*480*16);check(module._gpu_float_read(p),'Read');const at=p+(240*640+320)*16,raw=module.HEAPU8.slice(at,at+16),actual=Array.from(new Uint32Array(raw.buffer)),values=Array.from(new Float32Array(raw.buffer));module._gpu_release(p);const different=actual.reduce((sum,w,i)=>sum+(w!==n.resultWords[i]),0);differentWords+=different;reports.push({stage:n.stage,frame:n.frame,corner:n.corner,draw:n.draw,sourceWords:n.sourceWords,matrixWords:n.matrixWords,nativeWords:n.resultWords,portableWords:actual,nativeValues:n.resultValues,portableValues:values,differentWords:different});status.textContent='Read '+reports.length+' / 84';await new Promise(requestAnimationFrame);
