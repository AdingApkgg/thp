<!doctype html><html lang="zh"><meta charset="utf-8"><title>TH14 完整构造文字 GPU 对照</title>
<style>body{background:#191c26;color:#eee;font:16px system-ui;margin:28px}button{font:inherit;padding:12px}canvas{image-rendering:pixelated}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-width:1100px}</style>
<h1>TH14 完整构造文字 GPU 对照</h1><p>真实对话构造器的四行文字：90 组字体／对齐／文本组合，360 次连续纹理写入，逐次检查整个 1024×1024 图集。移植侧实际 FontDevice、动画管理器和渲染器，对照原作 GDI、D3DX 上传和原生 HAL 画面。面板为空，文本参数受控，尚非完整游戏画面验收。</p>
<button id="run">运行 90 组对照</button><p id="status">等待运行</p><canvas id="canvas" width="640" height="480"></canvas><pre id="result"></pre>
<script type="module">
import create from './gpu.mjs';
const status=document.querySelector('#status'),button=document.querySelector('#run'),result=document.querySelector('#result');
const hex=async b=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',b)),n=>n.toString(16).padStart(2,'0')).join('');
button.addEventListener('click',async()=>{button.disabled=true;try{
const [native,expected,build,manifest]=await Promise.all([fetch('./native.json').then(r=>r.json()),fetch('./native.bgra').then(r=>r.arrayBuffer()).then(b=>new Uint8Array(b)),fetch('./build.json').then(r=>r.json()),fetch('./fonts/manifest.json').then(r=>r.json())]);
const core=await create({canvas:document.querySelector('#canvas')});core.FS.mkdir('/fonts');
for(const name of ['font0.bin','font1.bin','font2.bin','font3.bin','cp932.bin','blend4444.bin','font4.bin','font5.bin','font6.bin','font7.bin']){const bytes=new Uint8Array(await fetch('/fonts/'+name).then(r=>r.arrayBuffer())),entry=manifest.files.find(r=>r.file===name);if(!entry||entry.bytes!==bytes.length||entry.sha256!==await hex(bytes))throw Error('字体哈希 '+name);core.FS.writeFile('/fonts/'+name,bytes);}
if(!core._gpu_initialize())throw Error('字体或渲染器初始化失败');
const bytes=new Uint8Array(await fetch('/resources/text.anm').then(r=>r.arrayBuffer()));if(await hex(bytes)!==native.resourceHashes['text.anm'])throw Error('text.anm 哈希');let p=core._malloc(bytes.length);core.HEAPU8.set(bytes,p);if(!core._load_resource(p,bytes.length))throw Error('text.anm 解析');core._free(p);
const state=()=>Array.from(new Uint32Array(core.HEAPU8.buffer,core._sprite_data(),4*38));
const equal=(a,b,where)=>{if(JSON.stringify(a)!==JSON.stringify(b))throw Error(where+' 状态不符 '+JSON.stringify({actual:a,native:b}));};
const actual=new Uint8Array(expected.length),rows=[],copies=[];let animatedFrames=0,floatComponents=0,nonExactFloatValues=0;
for(const c of native.cases){const [font,profile,alignment]=c.input;if(!core._text_gpu_begin())throw Error('构造失败 '+c.index);equal(state(),c.initial.flat(),'构造 '+c.index);
const text=Uint8Array.from(c.text.match(/../g),v=>parseInt(v,16));p=core._malloc(text.length+1);core.HEAPU8.set(text,p);core.HEAPU8[p+text.length]=0;
for(const write of c.writes){const atlas=core._text_gpu_write(write.line,font,alignment,c.color,c.textOffset,c.spacing,p);if(!atlas)throw Error('写入失败 '+c.index+'/'+write.line);const hash=await hex(new Uint8Array(core.HEAPU8.buffer,atlas,1024*1024*2).slice()),want=c.textureCopies[write.line].textureSha256;copies.push({index:c.index,line:write.line,sha256:hash,nativeSha256:want,exact:hash===want});if((core._text_gpu_flags(write.line)&1)!==(write.finalFlags&1))throw Error('写入 dirty 标志不符');}core._free(p);equal(state(),c.written.flat(),'文字写入 '+c.index);core._text_gpu_show();
for(const [frame,f] of c.frames.entries()){if(!core._text_gpu_step())throw Error('动画更新失败 '+c.index+'/'+frame);++animatedFrames;const n=core._geometry_count();if(n!==f.draws.length)throw Error('四边形数量不符 '+c.index+'/'+frame);const words=new Uint32Array(core.HEAPU8.buffer,core._geometry_data(),n*28),vertices=new Float32Array(core.HEAPU8.buffer,core._geometry_data(),n*28),material=new Uint32Array(core.HEAPU8.buffer,core._geometry_materials(),n*9);for(const [q,d] of f.draws.entries()){equal(Array.from(material.slice(q*9,q*9+9)),d.material,'材质 '+c.index+'/'+frame+'/'+q);for(const [v,fields] of d.vertices.entries())for(const [field,want] of fields.entries()){const at=q*28+v*7+field;if(field===4){if(words[at]!==want)throw Error('颜色不符');}else{const actual=vertices[at],difference=Math.abs(actual-want);if(!Number.isFinite(actual)||difference>Math.max(1e-5,Math.abs(want)*2.4e-7))throw Error('顶点不符');++floatComponents;if(actual!==want)++nonExactFloatValues;}}}}
const address=core._text_gpu_frame(...c.crop),pixels=new Uint8Array(core.HEAPU8.buffer,address,c.size);actual.set(pixels,c.offset);let channels=0,max=0,first=null,foreground=0;for(let j=0;j<c.size;j++){const a=pixels[j],b=expected[c.offset+j],delta=Math.abs(a-b);if(delta){++channels;max=Math.max(max,delta);first??={x:Math.floor(j/4)%640,y:Math.floor(j/2560),channel:j%4,portable:a,d3d9:b};}}for(let j=0;j<c.size;j+=4)if(expected[c.offset+j]!==139||expected[c.offset+j+1]!==103||expected[c.offset+j+2]!==66||expected[c.offset+j+3]!==255)++foreground;
rows.push({index:c.index,input:c.input,drawCount:core._text_gpu_quads(),nativeDrawCount:c.drawCount,foregroundPixels:foreground,differentChannels:channels,maxDelta:max,first,pixelsSha256:await hex(pixels.slice())});status.textContent=`已比较 ${c.index+1}/${native.cases.length} 组，${copies.filter(r=>r.exact).length}/${copies.length} 次图集相同`;await new Promise(resolve=>requestAnimationFrame(resolve));}
const gl=document.querySelector('#canvas').getContext('webgl2'),info=gl.getExtension('WEBGL_debug_renderer_info');const report={completeGame:false,nativeEquivalent:false,cases:rows.length,animatedFrames,floatComponents,nonExactFloatValues,textureWrites:copies.length,exactTextures:copies.filter(r=>r.exact).length,strictPixelsEqual:rows.every(r=>!r.differentChannels),exactCases:rows.filter(r=>!r.differentChannels).length,renderedCases:rows.filter(r=>r.foregroundPixels>0).length,comparedChannels:expected.length,differentChannels:rows.reduce((n,r)=>n+r.differentChannels,0),maxDelta:Math.max(...rows.map(r=>r.maxDelta)),nativePixelsSha256:await hex(expected),portablePixelsSha256:await hex(actual),wasmSha256:build.wasmSha256,debugRenderer:info?gl.getParameter(info.UNMASKED_RENDERER_WEBGL):null,copies,rows};status.textContent=`已完成 ${report.cases} 组；图集 ${report.exactTextures}/${report.textureWrites} 相同；画面 ${report.exactCases}/${report.cases} 相同；有前景 ${report.renderedCases}；最大差 ${report.maxDelta}`;result.textContent=JSON.stringify(report,null,2);
}catch(e){status.textContent='测试失败：'+e.message;result.textContent=String(e.stack||e);}finally{button.disabled=false;}});
</script></html>
