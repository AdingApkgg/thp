<!doctype html><html lang="zh"><meta charset="utf-8"><title>TH14 雾后颜色浮点对照</title>
<style>body{background:#191c26;color:#eee;font:16px system-ui;margin:28px}button{font:inherit;padding:10px}canvas{width:160px;height:120px}pre{white-space:pre-wrap;max-width:1100px}</style>
<h1>TH14 雾后颜色浮点对照</h1><p>原生硬件顶点处理与独立候选渲染器的 RGBA 浮点值；仅诊断。</p>
<button id="run">读取 1920 场景的 RGBA 浮点颜色</button><p id="status">等待运行</p><div id="canvases"></div><pre id="result"></pre>
<script type="module">
const hex=async b=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',b)),n=>n.toString(16).padStart(2,'0')).join('');
document.querySelector('#run').addEventListener('click',async()=>{const button=document.querySelector('#run'),status=document.querySelector('#status'),result=document.querySelector('#result');button.disabled=true;try{
 const [native,bytes]=await Promise.all([fetch('./colors/native.json').then(r=>r.json()),fetch('./colors/native.rgba32f').then(r=>r.arrayBuffer())]);const expected=new DataView(bytes),groups=[],critical=[],builds=[];
 const points=[[421,8,7],[1261,14,13],[1262,17,19],[1371,25,6],[1597,19,19],[91,7,19],[794,13,19],[842,11,10],[843,9,24],[856,12,10],[920,14,22],[966,14,24],[1434,18,9],[1449,11,4],[1733,14,14],[1749,14,14]];
 for(const [channel,component] of ['r','g','b','a'].entries()){
  status.textContent='正在读取 '+component+' 通道';const prefix='./float-color-'+component+'/',build=await fetch(prefix+'build.json').then(r=>r.json()),create=(await import(prefix+'gpu.mjs')).default,canvas=document.createElement('canvas');canvas.id='canvas';canvas.width=640;canvas.height=480;document.querySelector('#canvases').append(canvas);const core=await create({canvas});if(!core._gpu_initialize())throw Error('Renderer 初始化失败');builds.push({channel:component,wasmSha256:build.wasmSha256});
  let compared=0,differentFloats=0,maxDelta=0;const first=[],encoded=new Uint8Array(native.cases.length*4096);
  for(let i=0;i<native.cases.length;i++){
   const c=native.cases[i],p=core._gpu_world_profile_case(c.profile,c.world,c.view,c.projection,c.textureTransform,c.fog,c.range,c.point);if(!p)throw Error('浮点位读取失败');const pixel=new Uint8Array(core.HEAPU8.buffer,p,4096),decoded=encoded.subarray(i*4096,(i+1)*4096),v=new DataView(decoded.buffer,decoded.byteOffset,4096);
   for(let j=0;j<4096;j+=4){decoded[j]=pixel[j+2];decoded[j+1]=pixel[j+1];decoded[j+2]=pixel[j];decoded[j+3]=pixel[j+3];}
   for(let j=0;j<1024;j++){if(expected.getFloat32(i*16384+j*16+12,true)===1)continue;const a=v.getFloat32(j*4,true),b=expected.getFloat32(i*16384+j*16+channel*4,true);if(!Number.isFinite(a))throw Error('浮点解码失败');compared++;const delta=Math.abs(a-b);if(a!==b){differentFloats++;maxDelta=Math.max(maxDelta,delta);if(first.length<4)first.push({index:i,x:j%32,y:Math.floor(j/32),native:b,portable:a,delta});}}
   for(const [index,x,y] of points)if(i===index){const j=y*32+x;critical.push({index,x,y,channel:component,fog:c.fog,native:expected.getFloat32(i*16384+j*16+channel*4,true),portable:v.getFloat32(j*4,true)});}
  }
  groups.push({channel:component,compared,differentFloats,maxDelta,first,encodedPortableSha256:await hex(encoded)});canvas.id='canvas-'+component;
 }
 result.textContent=JSON.stringify({diagnosticOnly:true,completeGame:false,nativeEquivalent:false,cases:native.cases.length,vertexProcessing:native.vertexProcessing,nativePixelsSha256:await hex(bytes),builds,groups,critical},null,2);status.textContent='已读取 1920 场景 RGBA 浮点颜色';
 }catch(e){status.textContent='诊断失败：'+e.message;result.textContent=String(e.stack||e);}finally{button.disabled=false;}});
</script></html>
